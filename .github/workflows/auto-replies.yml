name: Auto-Reply to Comments

on:
  schedule:
    # Runs every 10 minutes (offset by 5 min from publish cron to spread load)
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger replies cron
        env:
          # Passed as an env var so the value is not written into the script or logs.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS --fail-with-body -w "\n%{http_code}" --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://dashboard-steel-delta-52.vercel.app/api/cron/replies") || curl_ec=$?
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP ${code:-000}"
          echo "Response: $body"
          if [ "${curl_ec:-0}" != "0" ] || [ "$code" != "200" ]; then
            echo "::error::Cron endpoint returned ${code:-000}"
            exit 1
          fi
