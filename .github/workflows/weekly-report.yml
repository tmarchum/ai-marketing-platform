name: Weekly Report Email

on:
  schedule:
    # Every Sunday at 08:00 Israel time (05:00 UTC in winter, 06:00 in summer — using 06:00 as compromise)
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Send weekly report
        env:
          # Passed as an env var so the value is not written into the script or logs.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS --fail-with-body -w "\n%{http_code}" --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://dashboard-steel-delta-52.vercel.app/api/cron/weekly-report") || curl_ec=$?
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP ${code:-000}"
          echo "Response: $body"
          if [ "${curl_ec:-0}" != "0" ] || [ "$code" != "200" ]; then
            echo "::error::Weekly report failed with ${code:-000}"
            exit 1
          fi
